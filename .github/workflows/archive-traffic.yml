name: Archive GitHub traffic

on:
  schedule:
    - cron: "17 2 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Archive traffic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/archive_github_traffic.py
      - name: Commit archive if changed
        run: |
          if [ -z "$(git status --porcelain analytics/github-traffic)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/github-traffic
          git commit -m "chore: archive GitHub traffic"
          git push
